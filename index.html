.item input{

.item.completed{

}

}

@media(max-width:600px){
    header h1{font-size:21px}

}

/* =========================
   CONECTAR PARTIDA
========================= */

async function conectarPartida(){

    const nombre =
        document.getElementById("partida").value.trim();

    if(!nombre){
        alert("Escribe un nombre para la partida.");
        return;
    }

    partidaActual = nombre;

    document.getElementById("status").textContent =
        "Conectando...";

    const { data, error } =
        await supabaseClient
        .from("progreso")
        .select("item_id, conseguido")
        .eq("partida", partidaActual);

    if(error){

        console.error(error);

        document.getElementById("status").textContent =
            "Error al conectar.";

        return;
    }

    checked = {};

    data.forEach(row => {
        checked[row.item_id] = row.conseguido;
    });

    document.getElementById("status").textContent =
        "🟢 Partida conectada: " + partidaActual;

    showBundles();

    escucharCambios();
}


/* =========================
   GUARDAR CAMBIO
========================= */

async function cambiarItem(id, valor){

    if(!partidaActual){
        alert("Primero conecta una partida.");
        return;
    }

    checked[id] = valor;

    const { error } =
        await supabaseClient
        .from("progreso")
        .upsert({

            partida: partidaActual,

            item_id: id,

            conseguido: valor,

            actualizado_en:
                new Date().toISOString()

        },{
            onConflict:"partida,item_id"
        });

    if(error){
        console.error(error);
        alert("No se pudo guardar el cambio.");
    }

    updateProgress();
}


/* =========================
   ESCUCHAR CAMBIOS
========================= */

function escucharCambios(){

    supabaseClient
    .channel("progreso-" + partidaActual)

    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:"progreso",
            filter:"partida=eq." + partidaActual
        },
        payload => {

            if(
                payload.eventType === "INSERT" ||
                payload.eventType === "UPDATE"
            ){

                checked[payload.new.item_id] =
                    payload.new.conseguido;

                showBundles();
            }

        }
    )

    .subscribe();
}


/* =========================
   MOSTRAR LOTES
========================= */

function showBundles(){

    const content =
        document.getElementById("content");

    content.innerHTML = "";

    for(const room in bundles){

        const roomSection =
            document.createElement("div");

        roomSection.className = "section";

        const roomTitle =
            document.createElement("div");

        roomTitle.className =
            "section-title";

        roomTitle.innerHTML =
            `<span>🏛️ ${room}</span><span>▼</span>`;

        const roomItems =
            document.createElement("div");

        roomItems.className = "items";

        roomTitle.onclick = () => {
            roomItems.classList.toggle("open");
        };


        bundles[room].forEach(bundle => {

            const bundleTitle =
                document.createElement("div");

            bundleTitle.className =
                "section-title";

            bundleTitle.style.fontSize =
                "15px";

            bundleTitle.innerHTML =
                `<span>📦 ${bundle.name}</span><span>▼</span>`;


            const bundleItems =
                document.createElement("div");

            bundleItems.className =
                "items";


            bundleTitle.onclick = () => {
                bundleItems.classList.toggle("open");
            };


            bundle.items.forEach(item => {

                const id =
                    room + "_" +
                    bundle.name + "_" +
                    item;

                const row =
                    document.createElement("label");

                row.className = "item";


                const checkbox =
                    document.createElement("input");

                checkbox.type = "checkbox";

                checkbox.checked =
                    !!checked[id];


                const text =
                    document.createElement("span");

                text.textContent = item;


                if(checkbox.checked){
                    row.classList.add("completed");
                }


                checkbox.onchange = () => {

                    row.classList.toggle(
                        "completed",
                        checkbox.checked
                    );

                    cambiarItem(
                        id,
                        checkbox.checked
                    );

                };


                row.appendChild(checkbox);
                row.appendChild(text);

                bundleItems.appendChild(row);

            });


            roomItems.appendChild(bundleTitle);
            roomItems.appendChild(bundleItems);

        });


        roomSection.appendChild(roomTitle);
        roomSection.appendChild(roomItems);

        content.appendChild(roomSection);

    }

    updateProgress();
}


/* =========================
   PROGRESO
========================= */

function updateProgress(){

    let total = 0;
    let done = 0;

    document
    .querySelectorAll(".item input")
    .forEach(input => {

        total++;

        if(input.checked){
            done++;
        }

    });

    document.getElementById("progressText")
        .textContent =
        `${done} / ${total}`;

    const percentage =
        total === 0
        ? 0
        : (done / total) * 100;

    document.getElementById("progressFill")
        .style.width =
        percentage + "%";
}


/* =========================
   BOTONES
========================= */

document.getElementById("byBundle").onclick = () => {

    document.getElementById("byBundle")

    document.getElementById("bySeason")
        .classList.remove("active");

    showBundles();
};


document.getElementById("bySeason").onclick = () => {
