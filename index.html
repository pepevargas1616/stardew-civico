/* =====================================================
   ID ESTABLE
===================================================== */

function obtenerId(room,bundle,item){

    return (
        "sve_" +
        bundle.id +
        "_" +
        item.id
    );

}


/* =====================================================
   INICIALIZAR SUPABASE
===================================================== */

function iniciarSupabase(){

    try{

        if(
            !window.supabase ||
            typeof window.supabase.createClient !== "function"
        ){

            throw new Error(
                "No se pudo cargar la biblioteca de Supabase."
            );

        }

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        return true;

    }
    catch(error){

        console.error(error);

        document.getElementById("status").textContent =
            "🔴 Supabase no pudo iniciarse";

        return false;

    }

}


/* =====================================================
   CONECTAR PARTIDA
===================================================== */

async function conectarPartida(){

    const input =
        document.getElementById("partida");

    const status =
        document.getElementById("status");

    const nombre =
        input.value.trim();

    if(!nombre){

        status.textContent =
            "🟠 Escribe primero un nombre de partida.";

        return;

    }

    if(!supabaseClient){

        if(!iniciarSupabase()){

            return;

        }

    }

    partidaActual = nombre;

    status.textContent =
        "🟡 Conectando partida...";

    try{

        const resultado =
            await supabaseClient
            .from("progreso")
            .select("item_id, conseguido")
            .eq("partida",partidaActual);

        console.log("Respuesta Supabase:",resultado);

        if(resultado.error){

            console.error(
                "ERROR SUPABASE:",
                resultado.error
            );

            status.textContent =
                "🔴 Error: " +
                resultado.error.message;

            return;

        }

        checked = {};

        if(resultado.data){

            resultado.data.forEach(row=>{

                checked[row.item_id] =
                    !!row.conseguido;

            });

        }

        status.textContent =
            "🟢 Partida conectada: " +
            partidaActual;

        mostrarVista();

        escucharCambios();

    }
    catch(error){

        console.error(error);

        status.textContent =
            "🔴 Error: " +
            error.message;

    }

}


/* =====================================================
   GUARDAR ITEM
===================================================== */

async function cambiarItem(id,valor){

    if(!partidaActual){

        document.getElementById("status").textContent =
            "🟠 Conecta una partida primero.";

        return;

    }

    checked[id] = valor;

    mostrarVista();

    try{

        const {error} =
            await supabaseClient
            .from("progreso")
            .upsert(
                {
                    partida:partidaActual,
                    item_id:id,
                    conseguido:valor,
                    actualizado_en:
                        new Date().toISOString()
                },
                {
                    onConflict:"partida,item_id"
                }
            );

        if(error){

            console.error(
                "ERROR GUARDANDO:",
                error
            );

            document.getElementById("status").textContent =
                "🔴 Error al guardar: " +
                error.message;

        }

    }
    catch(error){

        console.error(error);

        document.getElementById("status").textContent =
            "🔴 Error al guardar: " +
            error.message;

    }

}


/* =====================================================
   REALTIME
===================================================== */

function escucharCambios(){

    if(!supabaseClient || !partidaActual){
        return;
    }

    if(canalActual){

        supabaseClient.removeChannel(
            canalActual
        );

    }

    canalActual =
        supabaseClient
        .channel(
            "partida-" +
            partidaActual
        )
        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"progreso"
            },
            payload=>{

                if(
                    payload.new &&
                    payload.new.partida === partidaActual
                ){

                    checked[
                        payload.new.item_id
                    ] =
                    !!payload.new.conseguido;

                    mostrarVista();

                }

            }
        )
        .subscribe(
            estado=>{

                console.log(
                    "Realtime:",
                    estado
                );

            }
        );

}


/* =====================================================
   CREAR ITEM
===================================================== */

function crearItem(room,bundle,item){

    const id =
        obtenerId(
            room,
            bundle,
            item
        );

    const row =
        document.createElement("div");

    row.className = "item";

    if(checked[id]){
        row.classList.add("completed");
    }

    const main =
        document.createElement("div");

    main.className = "item-main";

    const checkbox =
        document.createElement("input");

    checkbox.type = "checkbox";

    checkbox.checked =
        !!checked[id];

    checkbox.addEventListener(
        "change",
        ()=>{
            cambiarItem(
                id,
                checkbox.checked
            );
        }
    );

    const name =
        document.createElement("span");

    name.className =
        "item-name";

    name.textContent =
        item.name;

    const info =
        document.createElement("div");

    info.className =
        "item-info";

    info.innerHTML =
        "<strong>Información</strong><br>" +
        "Cómo conseguirlo: " +
        "consulta el objeto dentro del juego.";

    name.addEventListener(
        "click",
        ()=>{
            info.classList.toggle("open");
        }
    );

    main.appendChild(checkbox);
    main.appendChild(name);

    row.appendChild(main);
    row.appendChild(info);

    return row;

}


/* =====================================================
   MOSTRAR LOTES
===================================================== */

function showBundles(){

    const content =
        document.getElementById("content");

    content.innerHTML = "";

    const busqueda =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    let encontrados = 0;

    for(const room in bundles){

        const roomSection =
            document.createElement("div");

        roomSection.className =
            "section";

        const roomTitle =
            document.createElement("div");

        roomTitle.className =
            "section-title";

        roomTitle.innerHTML =
            `<span>🏛️ ${room}</span>
             <span>▼</span>`;

        const roomItems =
            document.createElement("div");

        roomItems.className =
            "items";

        roomTitle.onclick =
            ()=>{
                roomItems.classList.toggle("open");
            };

        bundles[room].forEach(bundle=>{

            const filtrados =
                bundle.items.filter(
                    item =>
                        !busqueda ||
                        item.name
                        .toLowerCase()
                        .includes(busqueda)
                );

            if(
                busqueda &&
                filtrados.length === 0
            ){
                return;
            }

            encontrados +=
                filtrados.length;

            const bundleTitle =
                document.createElement("div");

            bundleTitle.className =
                "section-title";

            bundleTitle.style.fontSize =
                "15px";

            const completados =
                bundle.items.filter(
                    item =>
                        checked[
                            obtenerId(
                                room,
                                bundle,
                                item
                            )
                        ]
                ).length;

            bundleTitle.innerHTML =
                `<span>
                    📦 ${bundle.name}
                    <span class="bundle-count">
                    ${completados}/${bundle.items.length}
                    </span>
                </span>
                <span>▼</span>`;

            const bundleItems =
                document.createElement("div");

            bundleItems.className =
                "items";

            bundleTitle.onclick =
                ()=>{
                    bundleItems.classList.toggle(
                        "open"
                    );
                };

            filtrados.forEach(item=>{

                bundleItems.appendChild(
                    crearItem(
                        room,
                        bundle,
                        item
                    )
                );

            });

            roomItems.appendChild(
                bundleTitle
            );

            roomItems.appendChild(
                bundleItems
            );

        });

        if(roomItems.children.length){

            roomSection.appendChild(
                roomTitle
            );

            roomSection.appendChild(
                roomItems
            );

            content.appendChild(
                roomSection
            );

        }

    }

    if(
        busqueda &&
        encontrados === 0
    ){

        content.innerHTML =
            `<div class="card no-results">
                🔎 No encontré ese objeto.
             </div>`;

    }

    updateProgress();

}

                        .toLowerCase()
                        .includes(busqueda)
                    ){
                        return;
                    }

                    let entra = false;

                    if(bundle.season === "Todas"){
                        entra = true;
                    }
                    else if(
                        bundle.season === estacion
                    ){
                        entra = true;
                    }

                    if(entra){

                        elementos.push({
                            room,
                            bundle,
                            item
                        });

                    }

                });

            });

        }

        if(!elementos.length){
            return;
        }

        const titulo =
            document.createElement("div");

        titulo.className =
            "season-title";

        titulo.textContent =
            "🌱 " + estacion;

        content.appendChild(titulo);

        elementos.forEach(datos=>{

            const section =
                document.createElement("div");

            section.className =
                "section";

            const title =
                document.createElement("div");

            title.className =
                "section-title";

            title.innerHTML =
                `<span>
                    📦 ${datos.item.name}
                    <span class="bundle-count">
                    ${datos.bundle.name}
                    · ${datos.room}
                    </span>
                </span>
                <span>▼</span>`;

            const list =
                document.createElement("div");

            list.className =
                "items";

            list.appendChild(
                crearItem(
                    datos.room,
                    datos.bundle,
                    datos.item
                )
            );

            title.onclick =
                ()=>{
                    list.classList.toggle("open");
                };

            section.appendChild(title);
            section.appendChild(list);

            content.appendChild(section);

        });

    });

    updateProgress();

}


/* =====================================================
   VISTA
===================================================== */

function mostrarVista(){

    if(modoActual === "bundle"){
        showBundles();
    }
    else{
        showSeasons();
    }

}


/* =====================================================
   BOTONES
===================================================== */

document
.getElementById("byBundle")
.addEventListener(
    "click",
    ()=>{
        modoActual = "bundle";

        document
        .getElementById("byBundle")
        .classList.add("active");

        document
        .getElementById("bySeason")
        .classList.remove("active");

        showBundles();
    }
);

document
.getElementById("bySeason")
.addEventListener(
    "click",
    ()=>{
        modoActual = "season";

        document
        .getElementById("bySeason")
        .classList.add("active");

        document
        .getElementById("byBundle")
        .classList.remove("active");

        showSeasons();
    }
);

document
.getElementById("btnConectar")
.addEventListener(
    "click",
    conectarPartida
);

document
.getElementById("search")
.addEventListener(
    "input",
    mostrarVista
);


/* =====================================================
   PROGRESO
===================================================== */

function updateProgress(){

    let total = 0;
    let done = 0;

    for(const room in bundles){

        bundles[room].forEach(bundle=>{

            bundle.items.forEach(item=>{

                total++;

                const id =
                    obtenerId(
                        room,
                        bundle,
                        item
                    );

                if(checked[id]){
                    done++;
                }

            });

        });

    }

    document
    .getElementById("progressText")
    .textContent =
        `${done} / ${total}`;

    const porcentaje =
        total
        ? (done / total) * 100
        : 0;

    document
    .getElementById("progressFill")
    .style.width =
        porcentaje + "%";

}


/* =====================================================
   INICIO
===================================================== */

iniciarSupabase();

showBundles();

</script>
