/* =====================================================
   CONECTAR PARTIDA
===================================================== */

async function conectarPartida(){

    const nombre =
        document.getElementById("partida").value.trim();


    if(!nombre){

        alert(
            "Escribe un nombre para la partida."
        );

        return;
    }


    partidaActual = nombre;


    document.getElementById("status")
        .textContent =
        "🟡 Conectando...";


    const { data, error } =
        await supabaseClient
        .from("progreso")
        .select(
            "item_id, conseguido"
        )
        .eq(
            "partida",
            partidaActual
        );


    if(error){

        console.error(error);

        document.getElementById("status")
            .textContent =
            "🔴 Error al conectar.";

        return;
    }


    checked = {};


    data.forEach(row => {

        checked[row.item_id] =
            row.conseguido;

    });


    document.getElementById("status")
        .textContent =
        "🟢 Partida conectada: " +
        partidaActual;


    mostrarVista();


    escucharCambios();

}


/* =====================================================
   GUARDAR CAMBIO
===================================================== */

async function cambiarItem(
    id,
    valor
){

    if(!partidaActual){

        alert(
            "Primero conecta una partida."
        );

        return;
    }


    checked[id] = valor;


    const { error } =
        await supabaseClient
        .from("progreso")
        .upsert({

            partida:
                partidaActual,

            item_id:
                id,

            conseguido:
                valor,

            actualizado_en:
                new Date().toISOString()

        },{
            onConflict:
                "partida,item_id"
        });


    if(error){

        console.error(error);

        alert(
            "No se pudo guardar el cambio."
        );

        return;
    }


    updateProgress();

}


/* =====================================================
   ESCUCHAR CAMBIOS DE LA OTRA PERSONA
===================================================== */

function escucharCambios(){

    if(canalActual){

        supabaseClient
            .removeChannel(
                canalActual
            );

    }


    canalActual =
        supabaseClient
        .channel(
            "progreso-" +
            partidaActual
        );


    canalActual
    .on(

        "postgres_changes",

        {
            event:"*",
            schema:"public",
            table:"progreso",
            filter:
                "partida=eq." +
                partidaActual
        },

        payload => {

            if(
                payload.eventType ===
                "INSERT" ||

                payload.eventType ===
                "UPDATE"
            ){

                checked[
                    payload.new.item_id
                ] =
                    payload.new.conseguido;


                mostrarVista();

            }

        }

    )
    .subscribe();

}


/* =====================================================
   ID DEL OBJETO
===================================================== */

function obtenerId(
    room,
    bundle,
    item
){

    return (
        room +
        "_" +
        bundle +
        "_" +
        item
    );

}


/* =====================================================
   MOSTRAR LOTES
===================================================== */

function showBundles(){

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = "";


    const busqueda =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    let encontrados = 0;


    for(
        const room in bundles
    ){

        const roomSection =
            document.createElement(
                "div"
            );

        roomSection.className =
            "section";


        const roomTitle =
            document.createElement(
                "div"
            );

        roomTitle.className =
            "section-title";


        roomTitle.innerHTML =
            `<span>🏛️ ${room}</span>
             <span>▼</span>`;


        const roomItems =
            document.createElement(
                "div"
            );

        roomItems.className =
            "items";


        roomTitle.onclick = () => {

            roomItems.classList.toggle(
                "open"
            );

        };


        bundles[room].forEach(
            bundle => {

            const itemsFiltrados =
                bundle.items.filter(
                    item =>
                        !busqueda ||
                        item.toLowerCase()
                            .includes(busqueda)
                );


            if(
                busqueda &&
                itemsFiltrados.length === 0
            ){

                return;

            }


            encontrados +=
                itemsFiltrados.length;


            const bundleTitle =
                document.createElement(
                    "div"
                );


            bundleTitle.className =
                "section-title";


            bundleTitle.style.fontSize =
                "15px";


            const cantidad =
                bundle.items.length;


            const completados =
                bundle.items.filter(
                    item => {

                        const id =
                            obtenerId(
                                room,
                                bundle.name,
                                item
                            );

                        return !!checked[id];

                    }
                ).length;


            bundleTitle.innerHTML =
                `<span>
                    📦 ${bundle.name}
                    <span class="bundle-count">
                        ${completados}/${cantidad}
                    </span>
                 </span>
                 <span>▼</span>`;


            const bundleItems =
                document.createElement(
                    "div"
                );


            bundleItems.className =
                "items";


            bundleTitle.onclick = () => {

                bundleItems.classList.toggle(
                    "open"
                );

            };


            itemsFiltrados.forEach(
                item => {

                const id =
                    obtenerId(
                        room,
                        bundle.name,
                        item
                    );


                const row =
                    document.createElement(
                        "label"
                    );


                row.className =
                    "item";


                const checkbox =
                    document.createElement(
                        "input"
                    );


                checkbox.type =
                    "checkbox";


                checkbox.checked =
                    !!checked[id];


                const text =
                    document.createElement(
                        "span"
                    );


                text.textContent =
                    item;


                if(
                    checkbox.checked
                ){

                    row.classList.add(
                        "completed"
                    );

                }


                checkbox.onchange =
                    () => {

                    row.classList.toggle(
                        "completed",
                        checkbox.checked
                    );


                    cambiarItem(
                        id,
                        checkbox.checked
                    );

                };


                row.appendChild(
                    checkbox
                );

                row.appendChild(
                    text
                );

                bundleItems.appendChild(
                    row
                );

            });


            roomItems.appendChild(
                bundleTitle
            );

            roomItems.appendChild(
                bundleItems
            );

        });


        if(
            roomItems.children.length === 0
        ){

            return;

        }


        roomSection.appendChild(
            roomTitle
        );

        roomSection.appendChild(
            roomItems
        );


        content.appendChild(
            roomSection
        );

    }


    if(
        busqueda &&
        encontrados === 0
    ){

        content.innerHTML =
            `<div class="card no-results">
                🔎 No encontré ese objeto.
             </div>`;

    }


    updateProgress();

}

                const items =
                    bundle.items.filter(

                if(
                    items.length === 0
                ){

                encontrados +=

                const section =

                section.className =

                const title =

                list.className =

                title.onclick = () => {

                    list.classList.toggle(
                        "open"

                items.forEach(
                    item => {

                    const id =
                        obtenerId(
                            room,
                            bundle.name,
                            item
                        );


                    const row =
                        document.createElement(
                            "label"
                        );


                    row.className =
                        "item";


                    const checkbox =
                        document.createElement(
                            "input"
                        );


                    checkbox.type =
                        "checkbox";


                    checkbox.checked =
                        !!checked[id];


                    const text =
                        document.createElement(
                            "span"
                        );


                    text.textContent =
                        item;


                    if(
                        checkbox.checked
                    ){

                        row.classList.add(

                    }


                    checkbox.onchange =
                        () => {

                        row.classList.toggle(
                            "completed",
                            checkbox.checked

                        cambiarItem(
                            id,
                            checkbox.checked
                        );

                    };


                    row.appendChild(
                        checkbox

                    row.appendChild(
                        text

                    list.appendChild(
                        row
                    );

                });


                section.appendChild(
                    title

                section.appendChild(
                    list

                content.appendChild(
                    section

            });

        }


        if(
            encontrados === 0

            titulo.style.display =
                "none";

        }

    });


    updateProgress();

}

===================================================== */

    if(
        modoActual === "bundle"
    ){

        showBundles();

    }else{

        showSeasons();

    }

}

   BOTÓN POR LOTES
===================================================== */

    modoActual =
        "bundle";


    document
        .getElementById(
            "byBundle"
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            "bySeason"
        )
        .classList.remove(
            "active"
        );


    showBundles();

}

    document
        .getElementById(
            "byBundle"

}


/* =====================================================
   PROGRESO
===================================================== */

function updateProgress(){

    let total = 0;

    let done = 0;


    for(
        const room in bundles
    ){

        bundles[room].forEach(
            bundle => {

            bundle.items.forEach(
                item => {

                total++;


                const id =
                    obtenerId(
                        room,
                        bundle.name,
                        item
                    );


                if(
                    checked[id]
                ){

                    done++;

                }

            });

        });

    }


    document
        .getElementById(
            "progressText"
        )
        .textContent =
        `${done} / ${total}`;


    const percentage =
        total === 0
        ? 0
        : (done / total) * 100;


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        percentage + "%";

}


/* =====================================================
   INICIO
===================================================== */

showBundles();

</script>

</body>
