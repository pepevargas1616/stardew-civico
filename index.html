<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f1ea;
  color:#302b25;
}

.hidden{
  display:none!important;
}


/* =========================
   PANTALLA DE ENTRADA
========================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:430px;
  background:white;
  padding:30px;
  border-radius:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
  text-align:center;
}

.login-card h1{
  margin-top:0;
  font-size:28px;
}

.login-card p{
  color:#777;
}

.login-card input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
  margin:10px 0;
}

.login-card button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#6c5137;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.login-card button:hover{
  opacity:.9;
}

#status{
  margin-top:12px;
  font-size:14px;
}


/* =========================
   APP
========================= */

.container{
  width:min(1100px,94%);
  margin:20px auto 50px;
}

header{
  background:white;
  border-radius:20px;
  padding:18px 20px;
  margin-bottom:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

header h1{
  margin:0 0 5px;
}

#partidaActual{
  color:#777;
  font-size:14px;
}

.refresh-button{
  border:0;
  background:#eee9df;
  color:#40382f;
  padding:10px 14px;
  border-radius:11px;
  cursor:pointer;
  font-size:14px;
  white-space:nowrap;
}

.refresh-button:hover{
  background:#e3ddd2;
}

#refreshStatus{
  font-size:12px;
  color:#668f53;
  margin-top:7px;
  min-height:14px;
}


.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}


/* =========================
   PROGRESO
========================= */

.progress-main{
  font-size:21px;
  font-weight:bold;
  margin-bottom:4px;
}

.progress-secondary{
  color:#777;
  font-size:13px;
}

.progress-bar{
  width:100%;
  height:18px;
  background:#e8e4dc;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

#progressFill{
  height:100%;
  width:0%;
  transition:.25s;
  background:#668f53;
}

#progressText{
  margin-top:8px;
  font-weight:bold;
}


/* =========================
   BUSCADOR
========================= */

.search-box{
  display:flex;
  gap:8px;
}

.search-box input{
  flex:1;
  padding:13px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
}


/* =========================
   BOTONES DE MODO
========================= */

.mode-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.mode-buttons button{
  flex:1;
  min-width:150px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#e9e5dc;
  cursor:pointer;
  font-size:15px;
}

.mode-buttons button.active{
  background:#6c5137;
  color:white;
}


/* =========================
   HABITACIONES
========================= */

.room{
  margin-bottom:22px;
}

.room-title{
  padding:15px 16px;
  border-radius:15px;
  color:white;
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.room-progress{
  font-size:13px;
  font-weight:normal;
  background:rgba(255,255,255,.18);
  padding:6px 10px;
  border-radius:20px;
  white-space:nowrap;
}


/* Colores de habitaciones */

.room-crafts .room-title{
  background:#806246;
}

.room-pantry .room-title{
  background:#668b55;
}

.room-fish .room-title{
  background:#4787a5;
}

.room-boiler .room-title{
  background:#bd713c;
}

.room-bulletin .room-title{
  background:#76579a;
}

.room-vault .room-title{
  background:#b38b35;
}


/* =========================
   LOTES
========================= */

.bundle{
  background:white;
  border:1px solid #ddd;
  border-radius:15px;
  margin:8px 0;
  overflow:hidden;
}

.bundle-title{
  padding:14px 16px;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  background:var(--bundle-bg,#f2eee8);

  border-left:7px solid var(--bundle-color,#806246);

  transition:.15s;
}

.bundle-title:hover{
  filter:brightness(.98);
}

.bundle-title-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.bundle-icon{
  font-size:24px;
}

.bundle-name{
  font-weight:bold;
}

.bundle-count{
  font-size:13px;
  color:#666;
  white-space:nowrap;
}

.bundle-count.complete{
  color:#4e8140;
  font-weight:bold;
}

.items{
  padding:8px;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border-radius:10px;
  transition:.2s;

  flex-wrap:wrap;
}

.item:hover{
  background:#f5f3ef;
}

.item.completed{
  opacity:.55;
}

.item.completed .item-name{
  text-decoration:line-through;
}

.item input{
  width:20px;
  height:20px;
  cursor:pointer;
  flex:none;
}

.item-icon{
  font-size:22px;
  width:28px;
  text-align:center;
  flex:none;
}

.item-content{
  flex:1;
  cursor:pointer;
  min-width:120px;
}

.item-name{
  font-weight:600;
}

.item-requirement{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.info-button{
  border:0;
  background:#eee9e0;
  border-radius:50%;
  width:30px;
  height:30px;
  cursor:pointer;
  flex:none;
}


/* =========================
   INFO
========================= */

.info-panel{
  display:none;
  width:100%;
  flex-basis:100%;

  background:#f7f5f0;
  margin:0 8px 8px 8px;
  padding:14px;
  border-radius:12px;
  font-size:14px;
}

.info-panel.open{
  display:block;
}

.info-panel strong{
  display:block;
  margin-bottom:5px;
}


/* =========================
   ESTACIONES
========================= */

.season{
  margin-bottom:20px;
}

.season-title{
  padding:15px;
  border-radius:15px;
  background:#6c5137;
  color:white;
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.season-list{
  display:flex;
  flex-direction:column;
}

.season-item{
  background:white;
  border-radius:13px;
  margin:6px 0;
  padding:12px;

  display:flex;
  align-items:center;
  gap:10px;

  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.season-item.completed{
  opacity:.5;
}

.season-item input{
  width:20px;
  height:20px;
}

.season-info{
  flex:1;
  cursor:pointer;
  min-width:0;
}

.season-info strong{
  display:block;
}

.season-info small{
  color:#777;
}


/* =========================
   BUSQUEDA
========================= */

.search-result{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin:6px 0;

  display:flex;
  align-items:center;
  gap:10px;
}

.search-result.completed{
  opacity:.5;
}

.search-result.completed strong{
  text-decoration:line-through;
}

.search-result small{
  color:#777;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

  .container{
    width:96%;
  }

  header h1{
    font-size:24px;
  }

  .header-top{
    align-items:flex-start;
  }

  .refresh-button{
    padding:9px 10px;
    font-size:13px;
  }

  .bundle-title{
    padding:12px;
  }

  .item{
    padding:9px 6px;
  }

  .mode-buttons button{
    min-width:100%;
  }

  .room-title{
    font-size:17px;
  }

  .room-progress{
    font-size:11px;
    padding:5px 8px;
  }

}

</style>
</head>

    </div>

  </div>



  <div id="contenido"></div>


</div>

/* =========================================================
   PREPARAR DATOS
========================================================= */

function prepararDatos(){

  let total = 0;
  let totalBundles = 0;

  rooms.forEach(room=>{

    room.bundles.forEach(bundle=>{

      totalBundles++;

      bundle.items =
        bundle.items.map((item,index)=>{

          const id = item[0];

          total++;

          return {

            id:id,

            name:item[1],

            season:item[2],

            source:item[3],

            requirement:
              bundle.requirements &&
              bundle.requirements[index]
                ? bundle.requirements[index]
                : "",

            bundleId:bundle.id,

            bundleName:bundle.name,

            roomId:room.id,

            roomName:room.name

          };

        });

    });

  });

  window.totalItems = total;

  window.totalBundles = totalBundles;

}

prepararDatos();


/* =========================================================
   ID
========================================================= */

function obtenerId(room,bundle,item){

  /*
     IMPORTANTE:
     Se conserva el mismo formato del código actual
     para que no se pierdan los progresos existentes.
  */

  return "sve_" +
    room.id + "_" +
    bundle.id + "_" +
    item.id;

}


/* =========================================================
   EMOJI
========================================================= */

function obtenerEmoji(item){

  return emojis[item.id] || "📦";

}


/* =========================================================
   ESTADÍSTICAS DE LOTE
========================================================= */

function obtenerEstadisticasLote(room,bundle){

  let done = 0;

  bundle.items.forEach(item=>{

    const id =
      obtenerId(room,bundle,item);

    if(checked[id]){
      done++;
    }

  });

  const required =
    bundle.required ??
    bundle.items.length;

  const completed =
    done >= required;

  return {

    done:done,

    required:required,

    total:bundle.items.length,

    completed:completed

  };

}


/* =========================================================
   ESTADÍSTICAS DE HABITACIÓN
========================================================= */

function obtenerEstadisticasHabitacion(room){

  let completed = 0;

  room.bundles.forEach(bundle=>{

    if(
      obtenerEstadisticasLote(room,bundle)
        .completed
    ){

      completed++;

    }

  });

  return {

    completed:completed,

    total:room.bundles.length

  };

}


/* =========================================================
   ESTADÍSTICAS GLOBALES
========================================================= */

function obtenerEstadisticasGlobales(){

  let completedBundles = 0;
  let totalBundles = 0;

  let completedItems = 0;
  let totalItems = 0;


  rooms.forEach(room=>{

    room.bundles.forEach(bundle=>{

      totalBundles++;

      const stats =
        obtenerEstadisticasLote(
          room,
          bundle
        );

      if(stats.completed){
        completedBundles++;
      }

      bundle.items.forEach(item=>{

        totalItems++;

        const id =
          obtenerId(
            room,
            bundle,
            item
          );

        if(checked[id]){
          completedItems++;
        }

      });

    });

  });


  return {

    completedBundles,

    totalBundles,

    completedItems,

    totalItems

  };

}


/* =========================================================
   ACTUALIZAR PROGRESO PRINCIPAL
========================================================= */

function updateProgress(){

  const stats =
    obtenerEstadisticasGlobales();


  const porcentaje =
    stats.totalBundles > 0
      ? Math.round(
          (
            stats.completedBundles /
            stats.totalBundles
          ) * 100
        )
      : 0;


  document
    .getElementById("progressMain")
    .textContent =
      `${stats.completedBundles} / ${stats.totalBundles} lotes`;


  document
    .getElementById("progressSecondary")
    .textContent =
      `${stats.completedItems} / ${stats.totalItems} objetos conseguidos`;


  document
    .getElementById("progressFill")
    .style.width =
      porcentaje + "%";


  document
    .getElementById("progressText")
    .textContent =
      `${porcentaje}% completado`;

}


/* =========================================================
   CARGAR PROGRESO
========================================================= */

async function cargarProgreso(){

  const {data,error} =
    await supabaseClient
      .from("progreso")
      .select("item_id, conseguido")
      .eq("partida",partidaActual);


  if(error){

    console.error(error);

    document
      .getElementById("status")
      .textContent =
        "⚠️ No se pudo cargar el progreso.";

    return false;

  }


  checked = {};


  if(data){

    data.forEach(row=>{

      checked[row.item_id] =
        !!row.conseguido;

    });

  }


  updateProgress();

  return true;

}


/* =========================================================
   GUARDAR ITEM
========================================================= */

async function guardarItem(id){

  const {error} =
    await supabaseClient
      .from("progreso")
      .upsert(

        {

          partida:partidaActual,

          item_id:id,

          conseguido:!!checked[id],

          actualizado_en:
            new Date().toISOString()

        },

        {

          onConflict:
            "partida,item_id"

        }

      );


  if(error){

    console.error(
      "Error guardando:",
      error
    );

  }

}


/* =========================================================
   CAMBIAR ITEM
========================================================= */

async function cambiarItem(id,checkbox){

  checked[id] =
    checkbox.checked;


  const row =
    checkbox.closest(".item") ||
    checkbox.closest(".season-item") ||
    checkbox.closest(".search-result");


  if(row){

    row.classList.toggle(
      "completed",
      checkbox.checked
    );

  }


  updateProgress();

  actualizarTodosLosContadores();


  /*
     En estación:
     los objetos conseguidos bajan al final.
  */

  if(
    modoActual === "season" &&
    row
  ){

    const seasonContainer =
      row.parentElement;

    if(seasonContainer){

      ordenarTemporada(
        seasonContainer
      );

    }

  }


  await guardarItem(id);

}


/* =========================================================
   ACTUALIZAR CHECKBOX VISUAL
========================================================= */

function actualizarCheckboxVisual(id){

  const checkboxes =
    document.querySelectorAll(
      "input[data-item-id]"
    );


  checkboxes.forEach(checkbox=>{

    if(
      checkbox.dataset.itemId !== id
    ){

      return;

    }


    checkbox.checked =
      !!checked[id];


    const row =
      checkbox.closest(".item") ||
      checkbox.closest(".season-item") ||
      checkbox.closest(".search-result");


    if(row){

      row.classList.toggle(
        "completed",
        !!checked[id]
      );

    }

  });

}


/* =========================================================
   ACTUALIZAR TODOS LOS ELEMENTOS VISIBLES
========================================================= */

function actualizarTodosLosCheckboxes(){

  const checkboxes =
    document.querySelectorAll(
      "input[data-item-id]"
    );


  checkboxes.forEach(checkbox=>{

    const id =
      checkbox.dataset.itemId;

    const estado =
      !!checked[id];


    checkbox.checked =
      estado;


    const row =
      checkbox.closest(".item") ||
      checkbox.closest(".season-item") ||
      checkbox.closest(".search-result");


    if(row){

      row.classList.toggle(
        "completed",
        estado
      );

    }

  });


  if(modoActual === "season"){

    document
      .querySelectorAll(".season-list")
      .forEach(container=>{

        ordenarTemporada(
          container
        );

      });

  }

}

/* =========================================================
   CREAR ITEM
========================================================= */

function crearItem(item){

  const room =
    rooms.find(
      r=>r.id === item.roomId
    );


  const bundle =
    room.bundles.find(
      b=>b.id === item.bundleId
    );


  const id =
    obtenerId(
      room,
      bundle,
      item
    );


  const div =
    document.createElement("div");


  div.className =
    "item" +
    (
      checked[id]
        ? " completed"
        : ""
    );


  const infoId =
    "info_" +
    Math.random()
      .toString(36)
      .substring(2,10);


  div.innerHTML = `

    <input
      type="checkbox"
      data-item-id="${id}"
      ${checked[id] ? "checked" : ""}
    >


    <div class="item-icon">
      ${obtenerEmoji(item)}
    </div>


    <div
      class="item-content"
      onclick="toggleInfo('${infoId}')"
    >

      <div class="item-name">
        ${item.name}
      </div>

      ${
        item.requirement
        ?
        `<div class="item-requirement">
          ${item.requirement}
        </div>`
        :
        ""
      }

    </div>


    <button
      class="info-button"
      onclick="toggleInfo('${infoId}')"
    >
      ℹ️
    </button>


    <div
      id="${infoId}"
      class="info-panel"
    >

      <strong>
        📍 Fuente / ubicación
      </strong>

      ${item.source}


      <br><br>


      <strong>
        🌱 Temporada
      </strong>

      ${item.season}


      ${
        infoExtra[item.id]
        ?
        `<br><br>

        <strong>
          💡 Información
        </strong>

        ${infoExtra[item.id]}`
        :
        ""
      }

    </div>

  `;


  const checkbox =
    div.querySelector("input");


  checkbox.addEventListener(
    "change",
    ()=>{
      cambiarItem(
        id,
        checkbox
      );
    }
  );


  return div;

}

      >
        ${roomStats.completed}/${roomStats.total} lotes
      </span>

    `;


    roomDiv.appendChild(
      roomTitle
    );


    room.bundles.forEach(bundle=>{

      const bundleDiv =
        document.createElement("div");


      bundleDiv.className =
        "bundle";


      const title =
        document.createElement("div");


      title.className =
        "bundle-title";


      title.style.setProperty(
        "--bundle-color",
        bundle.color
      );


      title.style.setProperty(
        "--bundle-bg",
        bundle.bg
      );


      const itemsDiv =
        document.createElement("div");


      itemsDiv.className =
        "items";


      itemsDiv.style.display =
        "none";


      const stats =
        obtenerEstadisticasLote(
          room,
          bundle
        );


      title.innerHTML = `

        <div class="bundle-title-left">

          <span class="bundle-icon">
            ${bundle.icon}
          </span>

          <span class="bundle-name">
            ${bundle.name}
          </span>

        </div>


        <span
          class="bundle-count
          ${stats.completed ? "complete" : ""}"
          data-bundle-count="${room.id}_${bundle.id}"
        >
          ${Math.min(
            stats.done,
            stats.required
          )}/${stats.required}
          ${stats.completed ? "✓" : ""}
        </span>

      `;


      title.addEventListener(
        "click",
        ()=>{

          itemsDiv.style.display =
            itemsDiv.style.display === "none"
              ? "block"
              : "none";

        }
      );


      bundle.items.forEach(item=>{

        itemsDiv.appendChild(
          crearItem(item)
        );

      });


      bundleDiv.appendChild(
        title
      );


      bundleDiv.appendChild(
        itemsDiv
      );


      roomDiv.appendChild(
        bundleDiv
      );

    });


    contenido.appendChild(
      roomDiv
    );

  });


  actualizarTodosLosContadores();

}


/* =========================================================
   ACTUALIZAR CONTADORES
========================================================= */

function actualizarTodosLosContadores(){

  rooms.forEach(room=>{

    let roomCompleted = 0;


    room.bundles.forEach(bundle=>{

      const stats =
        obtenerEstadisticasLote(
          room,
          bundle
        );


      if(stats.completed){

        roomCompleted++;

      }


      const counter =
        document.querySelector(
          `[data-bundle-count="${room.id}_${bundle.id}"]`
        );


      if(counter){

        counter.textContent =
          `${Math.min(
            stats.done,
            stats.required
          )}/${stats.required}` +
          (
            stats.completed
              ? " ✓"
              : ""
          );


        counter.classList.toggle(
          "complete",
          stats.completed
        );

      }

    });


    const roomCounter =
      document.querySelector(
        `[data-room-progress="${room.id}"]`
      );


    if(roomCounter){

      roomCounter.textContent =
        `${roomCompleted}/${room.bundles.length} lotes`;

    }

  });


  updateProgress();

}


/* =========================================================
   ORDENAR ESTACIÓN
========================================================= */

function ordenarTemporada(container){

  const items =
    [...container.children];


  items.sort((a,b)=>{

    const aCheck =
      a.classList.contains(
        "completed"
      );


    const bCheck =
      b.classList.contains(
        "completed"
      );


    if(aCheck !== bCheck){

      return aCheck
        ? 1
        : -1;

    }


    const aName =
      a.querySelector(
        ".season-info strong"
      )
      ?.textContent
      .trim()
      .toLowerCase() || "";


    const bName =
      b.querySelector(
        ".season-info strong"
      )
      ?.textContent
      .trim()
      .toLowerCase() || "";


    return aName.localeCompare(
      bName
    );

  });


  items.forEach(item=>{

    container.appendChild(
      item
    );

  });

}


/* =========================================================
   MOSTRAR ESTACIONES
========================================================= */

function showSeasons(){

  modoActual = "season";


  const contenido =
    document.getElementById(
      "contenido"
    );


  contenido.innerHTML = "";


  const seasons = {

    "Primavera":{
      icon:"🌸",
      items:[]
    },

    "Verano":{
      icon:"☀️",
      items:[]
    },

    "Otoño":{
      icon:"🍂",
      items:[]
    },

    "Invierno":{
      icon:"❄️",
      items:[]
    }

  };


  rooms.forEach(room=>{

    room.bundles.forEach(bundle=>{

      bundle.items.forEach(item=>{

        const seasonText =
          item.season || "";


        const found = [];


        if(
          seasonText.includes(
            "Primavera"
          )
        ){

          found.push(
            "Primavera"
          );

        }


        if(
          seasonText.includes(
            "Verano"
          )
        ){

          found.push(
            "Verano"
          );

        }


        if(
          seasonText.includes(
            "Otoño"
          )
        ){

          found.push(
            "Otoño"
          );

        }


        if(
          seasonText.includes(
            "Invierno"
          )
        ){

          found.push(
            "Invierno"
          );

        }


        found.forEach(season=>{

          seasons[
            season
          ].items.push({

            room,

            bundle,

            item

          });

        });

      });

    });

  });


  Object.entries(seasons)
    .forEach(
      ([season,data])=>{


      if(
        data.items.length === 0
      ){

        return;

      }


      const section =
        document.createElement(
          "div"
        );


      section.className =
        "season";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "season-title";


      title.textContent =
        `${data.icon} ${season}`;


      const list =
        document.createElement(
          "div"
        );


      list.className =
        "season-list";


      data.items.sort((a,b)=>{

        const idA =
          obtenerId(
            a.room,
            a.bundle,
            a.item
          );


        const idB =
          obtenerId(
            b.room,
            b.bundle,
            b.item
          );


        const doneA =
          !!checked[idA];


        const doneB =
          !!checked[idB];


        if(
          doneA !== doneB
        ){

          return doneA
            ? 1
            : -1;

        }


        return a.item.name
          .localeCompare(
            b.item.name
          );

      });


      data.items.forEach(
        dataItem=>{

        const {
          room,
          bundle,
          item
        } = dataItem;


        const id =
          obtenerId(
            room,
            bundle,
            item
          );


        const row =
          document.createElement(
            "div"
          );


        row.className =
          "season-item" +
          (
            checked[id]
              ? " completed"
              : ""
          );


        const infoId =
          "seasonInfo_" +
          Math.random()
            .toString(36)
            .substring(2,10);


        row.innerHTML = `

          <input
            type="checkbox"
            data-item-id="${id}"
            ${checked[id] ? "checked" : ""}
          >


          <div class="item-icon">
            ${obtenerEmoji(item)}
          </div>


          <div
            class="season-info"
            onclick="toggleInfo('${infoId}')"
          >

            <strong>
              ${item.name}
            </strong>

            <small>
              ${room.name} · ${bundle.name}
            </small>

          </div>


          <button
            class="info-button"
            onclick="toggleInfo('${infoId}')"
          >
            ℹ️
          </button>


          <div
            id="${infoId}"
            class="info-panel"
          >

            <strong>
              📍 Fuente / ubicación
            </strong>

            ${item.source}


            <br><br>


            <strong>
              🌱 Temporada
            </strong>

            ${item.season}


            ${
              infoExtra[item.id]
              ?
              `<br><br>

              <strong>
                💡 Información
              </strong>

              ${infoExtra[item.id]}`
              :
              ""
            }

          </div>

        `;


        const checkbox =
          row.querySelector(
            "input"
          );


        checkbox.addEventListener(
          "change",
          ()=>{
            cambiarItem(
              id,
              checkbox
            );
          }
        );


        list.appendChild(
          row
        );

      });


      section.appendChild(
        title
      );


      section.appendChild(
        list
      );


      contenido.appendChild(
        section
      );

    });

}


/* =========================================================
   BUSCADOR
========================================================= */

function obtenerTodosLosItems(){

  const resultado = [];


  rooms.forEach(room=>{

    room.bundles.forEach(bundle=>{

      bundle.items.forEach(item=>{

        resultado.push({

          room,

          bundle,

          item

        });

      });

    });

  });


  return resultado;

}


function buscar(texto){

  const results =
    document.getElementById(
      "searchResults"
    );


  texto =
    texto
      .trim()
      .toLowerCase();


  if(!texto){

    results.innerHTML =
      "";

    return;

  }


  const encontrados =
    obtenerTodosLosItems()
      .filter(x=>{

        return (

          x.item.name
            .toLowerCase()
            .includes(texto)

          ||

          x.item.id
            .toLowerCase()
            .includes(texto)

        );

      });


  if(
    encontrados.length === 0
  ){

    results.innerHTML =
      "<p>No se encontró ese objeto.</p>";

    return;

  }


  results.innerHTML =
    "";


  encontrados.forEach(x=>{

    const {
      room,
      bundle,
      item
    } = x;


    const id =
      obtenerId(
        room,
        bundle,
        item
      );


    const row =
      document.createElement(
        "div"
      );


    row.className =
      "search-result" +
      (
        checked[id]
          ? " completed"
          : ""
      );


    row.innerHTML = `

      <input
        type="checkbox"
        data-item-id="${id}"
        ${checked[id] ? "checked" : ""}
      >


      <div class="item-icon">
        ${obtenerEmoji(item)}
      </div>


      <div style="flex:1">

        <strong>
          ${item.name}
        </strong>

        <br>

        <small>
          ${room.name} · ${bundle.name}
        </small>

      </div>

    `;


    const checkbox =
      row.querySelector(
        "input"
      );


    checkbox.addEventListener(
      "change",
      ()=>{
        cambiarItem(
          id,
          checkbox
        );
      }
    );


    results.appendChild(
      row
    );

  });

}


/* =========================================================
   REFRESCAR PROGRESO
========================================================= */

async function refrescarProgreso(){

  if(!partidaActual){

    return;

  }


  const refreshStatus =
    document.getElementById(
      "refreshStatus"
    );


  refreshStatus.textContent =
    "🔄 Actualizando...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("progreso")
      .select(
        "item_id, conseguido"
      )
      .eq(
        "partida",
        partidaActual
      );


  if(error){

    console.error(error);

    refreshStatus.textContent =
      "❌ No se pudo actualizar.";

    return;

  }


  checked = {};


  if(data){

    data.forEach(row=>{

      checked[
        row.item_id
      ] =
        !!row.conseguido;

    });

  }


  /*
     NO usamos showBundles()
     ni showSeasons() aquí.

     Por eso:
     - no volvemos al login
     - no cambiamos de vista
     - no cerramos los lotes
     - no perdemos la posición
  */

  actualizarTodosLosCheckboxes();

  actualizarTodosLosContadores();

  updateProgress();


  refreshStatus.textContent =
    "✓ Progreso actualizado";


  setTimeout(()=>{

    refreshStatus.textContent =
      "";

  },2500);

}


/* =========================================================
   REALTIME
========================================================= */

function iniciarRealtime(){

  if(realtimeChannel){

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "progreso_" +
        partidaActual
      )
      .on(

        "postgres_changes",

        {

          event:"*",

          schema:"public",

          table:"progreso",

          filter:
            `partida=eq.${partidaActual}`

        },

        payload=>{

          /*
             INSERT / UPDATE
          */

          if(
            payload.new &&
            payload.new.item_id
          ){

            const id =
              payload.new.item_id;


            checked[id] =
              !!payload.new.conseguido;


            actualizarCheckboxVisual(
              id
            );


            actualizarTodosLosContadores();

          }


          /*
             DELETE
          */

          if(
            payload.eventType === "DELETE" &&
            payload.old &&
            payload.old.item_id
          ){

            const id =
              payload.old.item_id;


            delete checked[id];


            actualizarCheckboxVisual(
              id
            );


            actualizarTodosLosContadores();

          }

        }

      )
      .subscribe();

}


/* =========================================================
   CONECTAR PARTIDA
========================================================= */

async function conectar(){

  const input =
    document.getElementById(
      "partida"
    );


  const status =
    document.getElementById(
      "status"
    );


  const nombre =
    input.value.trim();


  if(!nombre){

    status.textContent =
      "⚠️ Escribe un nombre para la partida.";

    return;

  }


  status.textContent =
    "🔄 Conectando...";


  partidaActual =
    nombre;


  const {
    error
  } =
    await supabaseClient
      .from("progreso")
      .select("item_id")
      .eq(
        "partida",
        partidaActual
      )
      .limit(1);


  if(error){

    console.error(error);

    status.textContent =
      "❌ Error de conexión con Supabase.";

    return;

  }


  const cargado =
    await cargarProgreso();


  if(!cargado){

    return;

  }


  document
    .getElementById(
      "partidaActual"
    )
    .textContent =
      `🎮 Partida: ${partidaActual}`;


  document
    .getElementById(
      "loginScreen"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "appContainer"
    )
    .classList
    .remove("hidden");


  showBundles();


  iniciarRealtime();

}


/* =========================================================
   BOTÓN CONECTAR
========================================================= */

document
  .getElementById(
    "btnConectar"
  )
  .addEventListener(
    "click",
    conectar
  );

   ENTER EN LOGIN
========================================================= */

document

  )
  .addEventListener(

    e=>{

      if(

        conectar();

  );


/* =========================================================
   BOTÓN ACTUALIZAR
========================================================= */

document
  .getElementById(
    "btnRefrescar"
  )
  .addEventListener(
    "click",
    refrescarProgreso
  );


/* =========================================================

document
  .getElementById(
    "btnLotes"
  )
  .addEventListener(
    "click",

      document

   BOTÓN ESTACIONES
========================================================= */

document
  .getElementById(
    "btnEstaciones"
  )
  .addEventListener(
    "click",
    ()=>{

      document
        .getElementById(
          "btnEstaciones"
        )
        .classList
        .add("active");


      document
        .getElementById(
          "btnLotes"
        )
        .classList
        .remove("active");


      showSeasons();

    }
  );


/* =========================================================
   BUSCADOR
========================================================= */

document
  .getElementById(
    "buscador"
  )
  .addEventListener(
    "input",
    e=>{

      buscar(
        e.target.value
      );

    }
  );


/* =========================================================
   INICIO
========================================================= */

updateProgress();

</script>
