<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f1e8;
    color:#3b3025;
}

header{
    background:#6b4f35;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:6px 0 0;
    font-size:14px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
}

input[type=text]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    margin:8px 0;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 15px;
    background:#6b4f35;
    color:white;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    opacity:.9;
}

.buttons{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.buttons button{
    flex:1;
}

button.active{
    background:#9a713f;
}

.progress-bar{
    width:100%;
    height:14px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-top:8px;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#6b9b45;
    transition:.3s;
}

.section{
    background:white;
    border-radius:12px;
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.section-title{
    padding:15px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.items{
    display:none;
    border-top:1px solid #eee;
}

.items.open{
    display:block;
}

.item{
    padding:12px 15px;
    border-bottom:1px solid #eee;
    display:block;
}

.item-main{
    display:flex;
    align-items:center;
    gap:10px;
}

.item input{
    width:20px;
    height:20px;
    flex-shrink:0;
}

.item.completed{
    opacity:.55;
}

.item.completed .item-name{
    text-decoration:line-through;
}

.item-name{
    cursor:pointer;
    flex:1;
}

.item-info{
    display:none;
    margin-top:10px;
    margin-left:30px;
    padding:10px;
    background:#f7f3eb;
    border-radius:8px;
    font-size:14px;
    line-height:1.5;
}

.item-info.open{
    display:block;
}

.item-info strong{
    color:#6b4f35;
}

#status{
    font-size:14px;
    margin-top:8px;
}

.search-box{
    margin-bottom:15px;
}

.search-box input{
    margin:0;
}

.bundle-count{
    font-size:13px;
    font-weight:normal;
    opacity:.7;
    margin-left:8px;
}

.season-title{
    background:#6b4f35;
    color:white;
    padding:14px;
    border-radius:10px;
    margin-bottom:10px;
    font-weight:bold;
}

.no-results{
    text-align:center;
    padding:25px;
    color:#777;
}

.info-line{
    margin-bottom:4px;
}

@media(max-width:600px){

    header h1{
        font-size:21px;
    }

    .buttons{
        flex-direction:column;
    }

}

</style>

</head>

<div class="container">


<!-- ==========================================
     PARTIDA
========================================== -->

<div class="card">

    id="partida"

</div>

========================================== -->

<div class="progress-bar">

<div

</div>

</div>

</div>


<!-- ==========================================
     BUSCADOR
========================================== -->

<div class="card search-box">

<input
    type="text"
    id="search"
    placeholder="Ejemplo: calabaza, pez, queso..."
    oninput="buscar()"

</div>


<!-- ==========================================
     BOTONES
========================================== -->

<div class="buttons">

<button

</button>


<button
    id="bySeason"
    onclick="mostrarPorEstacion()"
>

🌱 Por estación

</button>

</div>


<div id="content"></div>


</div>

/* =====================================================
   CONEXIÓN
===================================================== */

async function conectarPartida(){

    const nombre =
        document
        .getElementById("partida")
        .value
        .trim();


    if(!nombre){

        alert(
            "Escribe un nombre para la partida."
        );

        return;
    }


    partidaActual =
        nombre;


    document
        .getElementById("status")
        .textContent =
        "🟡 Conectando...";


    try{

        const { data, error } =
            await supabaseClient
            .from("progreso")
            .select(
                "item_id, conseguido"
            )
            .eq(
                "partida",
                partidaActual
            );


        if(error){

            console.error(
                "ERROR SUPABASE:",
                error
            );


            document
                .getElementById("status")
                .textContent =
                "🔴 Error al conectar";


            alert(
                "ERROR DE SUPABASE:\n\n" +
                error.message
            );


            return;

        }


        checked = {};


        if(data){

            data.forEach(
                row => {

                checked[
                    row.item_id
                ] =
                row.conseguido;

            });

        }


        document
            .getElementById("status")
            .textContent =
            "🟢 Partida conectada: " +
            partidaActual;


        mostrarVista();


        escucharCambios();

    }


    catch(error){

        console.error(
            "ERROR:",
            error
        );


        document
            .getElementById("status")
            .textContent =
            "🔴 Error de conexión";


        alert(
            "ERROR DE CONEXIÓN:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   GUARDAR
===================================================== */

async function cambiarItem(
    id,
    valor
){

    if(!partidaActual){

        alert(
            "Primero conecta una partida."
        );

        return;

    }


    checked[id] =
        valor;


    const { error } =
        await supabaseClient
        .from("progreso")
        .upsert({

            partida:
                partidaActual,

            item_id:
                id,

            conseguido:
                valor,

            actualizado_en:
                new Date()
                .toISOString()

        },{
            onConflict:
                "partida,item_id"
        });


    if(error){

        console.error(
            "ERROR GUARDANDO:",
            error
        );


        alert(
            "No se pudo guardar:\n\n" +
            error.message
        );


        return;

    }


    updateProgress();

}


/* =====================================================
   REALTIME
===================================================== */

function escucharCambios(){

    if(canalActual){

        supabaseClient
        .removeChannel(
            canalActual
        );

    }


    canalActual =
        supabaseClient
        .channel(
            "progreso-" +
            partidaActual
        );


    canalActual
    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:"progreso",
            filter:
                "partida=eq." +
                partidaActual
        },

        payload => {

            console.log(
                "Cambio recibido:",
                payload
            );


            if(
                payload.eventType ===
                "INSERT" ||

                payload.eventType ===
                "UPDATE"
            ){

                checked[
                    payload.new.item_id
                ] =
                payload.new.conseguido;


                mostrarVista();

            }

        }

    )


    .subscribe(
        status => {

            console.log(
                "Realtime:",
                status
            );

        }
    );

}


/* =====================================================
   OBTENER ID
===================================================== */

function obtenerId(
    room,
    bundle,
    item
){

    return (
        "sve_" +
        room +
        "_" +
        bundle.id +
        "_" +
        item.id
    );

}


/* =====================================================
   CREAR ITEM
===================================================== */

function crearItem(
    room,
    bundle,
    item
){

    const id =
        obtenerId(
            room,
            bundle,
            item
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "item";


    if(checked[id]){

        row.classList.add(
            "completed"
        );

    }


    const main =
        document.createElement(
            "div"
        );


    main.className =
        "item-main";


    const checkbox =
        document.createElement(
            "input"
        );


    checkbox.type =
        "checkbox";


    checkbox.checked =
        !!checked[id];


    checkbox.onchange =
        () => {

        row.classList.toggle(
            "completed",
            checkbox.checked
        );


        cambiarItem(
            id,
            checkbox.checked
        );

    };


    const name =
        document.createElement(
            "span"
        );


    name.className =
        "item-name";


    name.textContent =
        item.name;


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "item-info";


    let html = "";


    for(
        const key in item.info
    ){

        html +=
            `<div class="info-line">
                <strong>
                    ${traducirCampo(key)}:
                </strong>
                ${item.info[key]}
             </div>`;

    }


    info.innerHTML =
        html;


    name.onclick =
        () => {

        info.classList.toggle(
            "open"
        );

    };


    main.appendChild(
        checkbox
    );


    main.appendChild(
        name
    );


    row.appendChild(
        main
    );


    row.appendChild(
        info
    );


    return row;

}


/* =====================================================
   TRADUCIR CAMPOS
===================================================== */

function traducirCampo(
    campo
){

    const nombres = {

        temporada:"Temporada",

        lugar:"Lugar",

        clima:"Clima",

        horario:"Horario",

        metodo:"Cómo conseguirlo",

        cantidad:"Cantidad",

        calidad:"Calidad",

        nivel:"Requisito"

    };


    return nombres[campo] ||
           campo;

}


/* =====================================================
   MOSTRAR LOTES
===================================================== */

function showBundles(){

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML =
        "";


    const busqueda =
        document
        .getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    let encontrados =
        0;


    for(
        const room in bundles
    ){

        const roomSection =
            document.createElement(
                "div"
            );


        roomSection.className =
            "section";


        const roomTitle =
            document.createElement(
                "div"
            );


        roomTitle.className =
            "section-title";


        roomTitle.innerHTML =
            `<span>
                🏛️ ${room}
             </span>
             <span>▼</span>`;


        const roomItems =
            document.createElement(
                "div"
            );


        roomItems.className =
            "items";


        roomTitle.onclick =
            () => {

            roomItems.classList.toggle(
                "open"
            );

        };


        bundles[room].forEach(
            bundle => {

            const itemsFiltrados =
                bundle.items.filter(
                    item =>
                        !busqueda ||
                        item.name
                        .toLowerCase()
                        .includes(
                            busqueda
                        )
                );


            if(
                busqueda &&
                itemsFiltrados.length === 0
            ){

                return;

            }


            encontrados +=
                itemsFiltrados.length;


            const bundleTitle =
                document.createElement(
                    "div"
                );


            bundleTitle.className =
                "section-title";


            bundleTitle.style.fontSize =
                "15px";


            const cantidad =
                bundle.items.length;


            const completados =
                bundle.items.filter(
                    item => {

                    const id =
                        obtenerId(
                            room,
                            bundle,
                            item
                        );


                    return !!checked[id];

                }).length;


            bundleTitle.innerHTML =
                `<span>
                    📦 ${bundle.name}

                    <span
                        class="bundle-count"
                    >
                        ${completados}/${cantidad}
                    </span>

                 </span>

                 <span>▼</span>`;


            const bundleItems =
                document.createElement(
                    "div"
                );


            bundleItems.className =
                "items";


            bundleTitle.onclick =
                () => {

                bundleItems.classList.toggle(
                    "open"
                );

            };


            itemsFiltrados.forEach(
                item => {

                bundleItems.appendChild(
                    crearItem(
                        room,
                        bundle,
                        item
                    )
                );

            });


            roomItems.appendChild(
                bundleTitle
            );


            roomItems.appendChild(
                bundleItems
            );

        });


        if(
            roomItems.children.length === 0
        ){

            return;

        }


        roomSection.appendChild(
            roomTitle
        );


        roomSection.appendChild(
            roomItems
        );


        content.appendChild(
            roomSection
        );

    }


    if(
        busqueda &&
        encontrados === 0
    ){

        content.innerHTML =
            `<div class="card no-results">
                🔎 No encontré ese objeto.
             </div>`;

    }


    updateProgress();

}


/* =====================================================
   POR ESTACIÓN
===================================================== */

function showSeasons(){

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML =
        "";


    const busqueda =
        document
        .getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const estaciones = [

        "Primavera",
        "Verano",
        "Otoño",
        "Invierno"

    ];


    estaciones.forEach(
        estacion => {

        let contenidoEstacion =
            [];


        for(
            const room in bundles
        ){

            bundles[room].forEach(
                bundle => {

                if(
                    bundle.season ===
                    "Todas"
                ){

                    return;

                }


                if(
                    !bundle.season
                    .includes(
                        estacion
                    )
                ){

                    return;

                }


                bundle.items.forEach(
                    item => {

                    if(
                        busqueda &&
                        !item.name
                        .toLowerCase()
                        .includes(
                            busqueda
                        )
                    ){

                        return;

                    }


                    contenidoEstacion.push({
                        room:room,
                        bundle:bundle,
                        item:item
                    });

                });

            });

        }


        if(
            contenidoEstacion.length === 0
        ){

            return;

        }


        const titulo =
            document.createElement(
                "div"
            );


        titulo.className =
            "season-title";


        titulo.textContent =
            "🌱 " +
            estacion;


        content.appendChild(
            titulo
        );


        contenidoEstacion.forEach(
            datos => {

            const section =
                document.createElement(
                    "div"
                );


            section.className =
                "section";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "section-title";


            title.innerHTML =
                `<span>
                    📦 ${datos.item.name}

                    <span
                        class="bundle-count"
                    >
                        ${datos.bundle.name}
                        · ${datos.room}
                    </span>

                 </span>

                 <span>▼</span>`;


            const list =
                document.createElement(
                    "div"
                );


            list.className =
                "items";


            list.appendChild(
                crearItem(
                    datos.room,
                    datos.bundle,
                    datos.item
                )
            );


            title.onclick =
                () => {

                list.classList.toggle(
                    "open"
                );

            };


            section.appendChild(
                title
            );


            section.appendChild(
                list
            );


            content.appendChild(
                section
            );

        });

    });


    updateProgress();

}


/* =====================================================
   BUSCAR
===================================================== */

function buscar(){

    mostrarVista();

}


/* =====================================================
   MOSTRAR VISTA
===================================================== */

function mostrarVista(){

    if(
        modoActual ===
        "bundle"
    ){

        showBundles();

    }
    else{

        showSeasons();

    }

}


/* =====================================================
   POR LOTES
===================================================== */

function mostrarPorLotes(){

    modoActual =
        "bundle";


    document
        .getElementById(
            "byBundle"
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            "bySeason"
        )
        .classList.remove(
            "active"
        );


    showBundles();

}


/* =====================================================
   POR ESTACIÓN
===================================================== */

function mostrarPorEstacion(){

    modoActual =
        "season";


    document
        .getElementById(
            "bySeason"
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            "byBundle"
        )
        .classList.remove(
            "active"
        );


    showSeasons();

}


/* =====================================================
   PROGRESO
===================================================== */

function updateProgress(){

    let total =
        0;

    let done =
        0;


    for(
        const room in bundles
    ){

        bundles[room].forEach(
            bundle => {

            bundle.items.forEach(
                item => {

                total++;


                const id =
                    obtenerId(
                        room,
                        bundle,
                        item
                    );


                if(
                    checked[id]
                ){

                    done++;

                }

            });

        });

    }


    document
        .getElementById(
            "progressText"
        )
        .textContent =
        `${done} / ${total}`;


    const percentage =
        total === 0
        ? 0
        : (done / total) * 100;


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        percentage + "%";

}


/* =====================================================
   INICIO
===================================================== */

showBundles();
