<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f1e8;
    color:#3b3025;
}

header{
    background:#6b4f35;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:6px 0 0;
    font-size:14px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
}

input[type=text]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    margin:8px 0;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 15px;
    background:#6b4f35;
    color:white;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    opacity:.9;
}

.buttons{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.buttons button{
    flex:1;
}

button.active{
    background:#9a713f;
}

.progress-bar{
    width:100%;
    height:14px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-top:8px;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#6b9b45;
    transition:.3s;
}

.progress-details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

.progress-box{
    background:#f7f3eb;
    border-radius:9px;
    padding:10px;
    text-align:center;
}

.progress-number{
    font-size:20px;
    font-weight:bold;
}

.progress-label{
    font-size:12px;
    opacity:.7;
}

.section{
    background:white;
    border-radius:12px;
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.section-title{
    padding:15px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.items{
    display:none;
    border-top:1px solid #eee;
}

.items.open{
    display:block;
}

.item{
    padding:12px 15px;
    border-bottom:1px solid #eee;
}

.item:last-child{
    border-bottom:0;
}

.item-main{
    display:flex;
    align-items:center;
    gap:10px;
}

.item input{
    width:20px;
    height:20px;
    flex-shrink:0;
}

.item.completed{
    opacity:.55;
}

.item.completed .item-name{
    text-decoration:line-through;
}

.item-name{
    cursor:pointer;
    flex:1;
}

.item-info{
    display:none;
    margin-top:10px;
    margin-left:30px;
    padding:12px;
    background:#f7f3eb;
    border-radius:8px;
    font-size:14px;
    line-height:1.5;
}

.item-info.open{
    display:block;
}

.item-info strong{
    color:#6b4f35;
}

.item-info div{
    margin-bottom:4px;
}

#status{
    font-size:14px;
    margin-top:8px;
    padding:8px;
    border-radius:6px;
}

.search-box{
    margin-bottom:15px;
}

.search-box input{
    margin:0;
}

.bundle-count{
    font-size:13px;
    font-weight:normal;
    opacity:.7;
    margin-left:8px;
}

.bundle-complete{
    color:#5c8736;
    font-weight:bold;
}

.season-title{
    background:#6b4f35;
    color:white;
    padding:14px;
    border-radius:10px;
    margin-bottom:10px;
    font-weight:bold;
}

.no-results{
    text-align:center;
    padding:25px;
    color:#777;
}

.hidden{
    display:none;
}

@media(max-width:600px){

    header h1{
        font-size:21px;
    }

    .buttons{
        flex-direction:column;
    }

    .progress-details{
        grid-template-columns:1fr;
    }

}

</style>
</head>

Stardew Valley Expanded · Centro Cívico Normal

</header>

<!-- =====================================================
     ENTRADA DE PARTIDA
===================================================== -->

<div class="card">

<strong>🎮 Partida compartida</strong>

<p style="font-size:14px;opacity:.7;">
Escribe el mismo nombre de partida en ambos dispositivos
para compartir el progreso.
</p>

<input

</div>

===================================================== -->

<div class="progress-box">

<div

0 / 30
</div>

<div class="progress-label">

</div>

</div>


<div class="progress-box">

<div
    class="progress-number"
    id="itemProgress"

</div>

<div class="progress-label">
Objetos conseguidos
</div>

</div>

</div>


<div
    class="progress-bar"
>
<div
    class="progress-fill"
    id="progressFill"
></div>
</div>

</div>


<!-- =====================================================
     BUSCADOR
===================================================== -->

<div class="card search-box">

<strong>🔎 Buscar objeto</strong>

<input
    type="text"
    id="search"
    placeholder="Ejemplo: calabaza, pez, queso..."
>

</div>


<!-- =====================================================
     BOTONES
===================================================== -->

<div class="buttons">

<button
    id="byBundle"
    class="active"
>

</button>

<button
    id="bySeason"
>

</button>

</div>


<div id="content"></div>


</div>

/* =====================================================
   ID ESTABLE
===================================================== */

function obtenerId(room,bundle,item){

    return (
        "sve_" +
        bundle.id +
        "_" +
        item.id
    );

}


/* =====================================================
   INICIALIZAR SUPABASE
===================================================== */

function iniciarSupabase(){

    try{

        if(
            !window.supabase ||
            typeof window.supabase.createClient !== "function"
        ){

            throw new Error(
                "No se pudo cargar la biblioteca de Supabase."
            );

        }

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        return true;

    }
    catch(error){

        console.error(error);

        document.getElementById("status").textContent =
            "🔴 Supabase no pudo iniciarse.";

        return false;

    }

}


/* =====================================================
   CONECTAR PARTIDA
===================================================== */

async function conectarPartida(){

    const input =
        document.getElementById("partida");

    const status =
        document.getElementById("status");

    const nombre =
        input.value.trim();

    if(!nombre){

        status.textContent =
            "🟠 Escribe primero un nombre de partida.";

        return;

    }

    if(!supabaseClient){

        if(!iniciarSupabase()){

            return;

        }

    }

    partidaActual = nombre;

    status.textContent =
        "🟡 Conectando partida...";


    try{

        const resultado =
            await supabaseClient
            .from("progreso")
            .select(
                "item_id, conseguido"
            )
            .eq(
                "partida",
                partidaActual
            );


        console.log(
            "Respuesta Supabase:",
            resultado
        );


        if(resultado.error){

            console.error(
                "ERROR SUPABASE:",
                resultado.error
            );

            status.textContent =
                "🔴 Error de Supabase: " +
                resultado.error.message;

            return;

        }


        checked = {};


        if(resultado.data){

            resultado.data.forEach(row=>{

                checked[row.item_id] =
                    !!row.conseguido;

            });

        }


        status.textContent =
            "🟢 Partida conectada: " +
            partidaActual;


        mostrarVista();

        escucharCambios();

    }
    catch(error){

        console.error(error);

        status.textContent =
            "🔴 Error: " +
            error.message;

    }

}


/* =====================================================
   GUARDAR ITEM
===================================================== */

async function cambiarItem(id,valor){

    if(!partidaActual){

        document.getElementById("status").textContent =
            "🟠 Conecta una partida primero.";

        return;

    }


    checked[id] = valor;


    mostrarVista();


    try{

        const {error} =
            await supabaseClient
            .from("progreso")
            .upsert(

                {

                    partida:partidaActual,

                    item_id:id,

                    conseguido:valor,

                    actualizado_en:
                        new Date().toISOString()

                },

                {

                    onConflict:
                        "partida,item_id"

                }

            );


        if(error){

            console.error(
                "ERROR GUARDANDO:",
                error
            );

            document.getElementById("status").textContent =
                "🔴 Error al guardar: " +
                error.message;

        }

    }
    catch(error){

        console.error(error);

        document.getElementById("status").textContent =
            "🔴 Error al guardar: " +
            error.message;

    }

}


/* =====================================================
   REALTIME
===================================================== */

function escucharCambios(){

    if(
        !supabaseClient ||
        !partidaActual
    ){

        return;

    }


    if(canalActual){

        supabaseClient.removeChannel(
            canalActual
        );

    }


    canalActual =
        supabaseClient
        .channel(
            "partida-" +
            partidaActual
        )
        .on(

            "postgres_changes",

            {

                event:"*",

                schema:"public",

                table:"progreso"

            },

            payload=>{

                if(
                    payload.new &&
                    payload.new.partida === partidaActual
                ){

                    checked[
                        payload.new.item_id
                    ] =
                    !!payload.new.conseguido;


                    mostrarVista();

                }

            }

        )
        .subscribe(

            estado=>{

                console.log(
                    "Realtime:",
                    estado
                );

            }

        );

}

    if(datos.clima){

        html +=

    }

    if(datos.horario){

}


/* =====================================================
   CREAR ITEM
===================================================== */

function crearItem(room,bundle,item){

    const id =
        obtenerId(
            room,
            bundle,
            item
        );


    const row =
        document.createElement("div");

    row.className =
        "item";


    if(checked[id]){

        row.classList.add(
            "completed"
        );

    }


    const main =
        document.createElement("div");

    main.className =
        "item-main";


    const checkbox =
        document.createElement("input");

    checkbox.type =
        "checkbox";


    checkbox.checked =
        !!checked[id];


    checkbox.addEventListener(
        "change",
        ()=>{
            cambiarItem(
                id,
                checkbox.checked
            );
        }
    );


    const name =
        document.createElement("span");

    name.className =
        "item-name";


    name.textContent =
        item.name;


    const infoBox =
        document.createElement("div");

    infoBox.className =
        "item-info";


    infoBox.innerHTML =
        construirInfo(item);


    name.addEventListener(
        "click",
        ()=>{
            infoBox.classList.toggle(
                "open"
            );
        }
    );


    main.appendChild(
        checkbox
    );

    main.appendChild(
        name
    );


    row.appendChild(
        main
    );

    row.appendChild(
        infoBox
    );


    return row;

}


/* =====================================================
   OBTENER PROGRESO DE UN LOTE
===================================================== */

function progresoBundle(room,bundle){

    let done = 0;


    bundle.items.forEach(item=>{

        const id =
            obtenerId(
                room,
                bundle,
                item
            );


        if(checked[id]){

            done++;

        }

    });


    return done;

}


/* =====================================================
   MOSTRAR LOTES
===================================================== */

function showBundles(){

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = "";


    const busqueda =
        document
        .getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    let encontrados = 0;


    for(const room in bundles){

        const roomSection =
            document.createElement(
                "div"
            );

        roomSection.className =
            "section";


        const roomTitle =
            document.createElement(
                "div"
            );

        roomTitle.className =
            "section-title";


        roomTitle.innerHTML =
            `<span>🏛️ ${room}</span>
             <span>▼</span>`;


        const roomItems =
            document.createElement(
                "div"
            );

        roomItems.className =
            "items";


        roomTitle.onclick =
            ()=>{
                roomItems.classList.toggle(
                    "open"
                );
            };


        bundles[room].forEach(bundle=>{


            const filtrados =
                bundle.items.filter(
                    item =>
                        !busqueda ||
                        item.name
                        .toLowerCase()
                        .includes(
                            busqueda
                        )
                );


            if(
                busqueda &&
                filtrados.length === 0
            ){

                return;

            }


            encontrados +=
                filtrados.length;


            const bundleTitle =
                document.createElement(
                    "div"
                );

            bundleTitle.className =
                "section-title";


            bundleTitle.style.fontSize =
                "15px";


            const completados =
                progresoBundle(
                    room,
                    bundle
                );


            const completado =
                completados >=
                bundle.required;


            bundleTitle.innerHTML =
                `<span>
                    📦 ${bundle.name}

                    <span
                        class="bundle-count
                        ${completado ? "bundle-complete" : ""}"
                    >
                        ${completados}/${bundle.required}
                        ${completado ? " ✓" : ""}
                    </span>

                    <span class="bundle-count">
                        (${bundle.items.length} opciones)
                    </span>

                </span>

                <span>▼</span>`;


            const bundleItems =
                document.createElement(
                    "div"
                );

            bundleItems.className =
                "items";


            bundleTitle.onclick =
                ()=>{
                    bundleItems.classList.toggle(
                        "open"
                    );
                };


            filtrados.forEach(item=>{

                bundleItems.appendChild(

                    crearItem(
                        room,
                        bundle,
                        item
                    )

                );

            });


            roomItems.appendChild(
                bundleTitle
            );


            roomItems.appendChild(
                bundleItems
            );

        });


        if(roomItems.children.length){

            roomSection.appendChild(
                roomTitle
            );

            roomSection.appendChild(
                roomItems
            );

            content.appendChild(
                roomSection
            );

        }

    }


    if(
        busqueda &&
        encontrados === 0
    ){

        content.innerHTML =
            `<div class="card no-results">
                🔎 No encontré ese objeto.
             </div>`;

    }


    updateProgress();

}


/* =====================================================
   POR ESTACIÓN
===================================================== */

function showSeasons(){

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = "";


    const busqueda =
        document
        .getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const estaciones = [

        "Primavera",

        "Verano",

        "Otoño",

        "Invierno"

    ];


    estaciones.forEach(estacion=>{


        const elementos = [];


        for(const room in bundles){

            bundles[room].forEach(bundle=>{

                bundle.items.forEach(item=>{


                    if(

                        busqueda &&

                        !item.name
                        .toLowerCase()
                        .includes(
                            busqueda
                        )

                    ){

                        return;

                    }


                    let entra = false;


                    /*
                     * Los objetos de los lotes
                     * marcados "Todas" aparecen
                     * en todas las estaciones.
                     */

                    if(
                        bundle.season ===
                        "Todas"
                    ){

                        entra = true;

                    }

                    else if(

                        bundle.season ===
                        estacion

                    ){

                        entra = true;

                    }


                    if(entra){

                        elementos.push({

                            room,

                            bundle,

                            item

                        });

                    }

                });

            });

        }


        if(!elementos.length){

            return;

        }


        const titulo =
            document.createElement(
                "div"
            );


        titulo.className =
            "season-title";


        titulo.textContent =
            "🌱 " + estacion;


        content.appendChild(
            titulo
        );


        elementos.forEach(datos=>{


            const section =
                document.createElement(
                    "div"
                );


            section.className =
                "section";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "section-title";


            title.innerHTML =
                `<span>

                    📦 ${datos.item.name}

                    <span class="bundle-count">

                        ${datos.bundle.name}
                        ·
                        ${datos.room}

                    </span>

                </span>

                <span>▼</span>`;


            const list =
                document.createElement(
                    "div"
                );


            list.className =
                "items";


            list.appendChild(

                crearItem(

                    datos.room,

                    datos.bundle,

                    datos.item

                )

            );


            title.onclick =
                ()=>{
                    list.classList.toggle(
                        "open"
                    );
                };


            section.appendChild(
                title
            );

            section.appendChild(
                list
            );


            content.appendChild(
                section
            );

        });

    });


    updateProgress();

}


/* =====================================================
   MOSTRAR VISTA
===================================================== */

function mostrarVista(){

    if(
        modoActual ===
        "bundle"
    ){

        showBundles();

    }

    else{

        showSeasons();

    }

}


/* =====================================================
   BOTÓN LOTES
===================================================== */

document
.getElementById(
    "byBundle"
)
.addEventListener(
    "click",
    ()=>{

        modoActual =
            "bundle";


        document
        .getElementById(
            "byBundle"
        )
        .classList.add(

        );


        document
        .getElementById(
            "bySeason"
        )
        .classList.remove(

        );

    }
);

===================================================== */

document
.getElementById(
    "bySeason"
)
.addEventListener(
    "click",
    ()=>{

        modoActual =
            "season";


        document
        .getElementById(
            "bySeason"
        )
        .classList.add(

        );


        document
        .getElementById(
            "byBundle"
        )
        .classList.remove(

/* =====================================================
   CONECTAR
===================================================== */

document
.getElementById(

)
.addEventListener(

);


/* =====================================================
   ENTER EN NOMBRE DE PARTIDA
===================================================== */

document
.getElementById(

)
.addEventListener(

        if(

            "Enter"
        ){

/* =====================================================
   BUSCAR
===================================================== */

document
.getElementById(
    "search"
)
.addEventListener(
    "input",
    mostrarVista
);


/* =====================================================
   PROGRESO
===================================================== */

function updateProgress(){

    let totalItems = 0;

    let doneItems = 0;

    let totalBundles = 0;

    let doneBundles = 0;


    for(
        const room in bundles
    ){

        bundles[room].forEach(
            bundle=>{

                totalBundles++;


                let bundleDone = 0;


                bundle.items.forEach(
                    item=>{

                        totalItems++;


                        const id =
                            obtenerId(
                                room,
                                bundle,
                                item
                            );


                        if(
                            checked[id]
                        ){

                            doneItems++;

                            bundleDone++;

                        }

                    }
                );


                if(
                    bundleDone >=
                    bundle.required
                ){

                    doneBundles++;

                }

            }
        );

    }


    document
    .getElementById(
        "itemProgress"
    )
    .textContent =
        `${doneItems} / ${totalItems}`;


    document
    .getElementById(
        "bundleProgress"
    )
    .textContent =
        `${doneBundles} / ${totalBundles}`;


    /*
     * La barra principal representa
     * objetos conseguidos.
     */

    const porcentaje =
        totalItems
        ?
        (
            doneItems /
            totalItems
        ) * 100
        :
        0;


    document
    .getElementById(
        "progressFill"
    )
    .style.width =
        porcentaje + "%";

}


/* =====================================================
   INICIO
===================================================== */

iniciarSupabase();

showBundles();

</script>
